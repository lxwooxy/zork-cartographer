<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zork Cartographer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; }
    form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px; width: min(340px, calc(100vw - 32px)); }
    h1 { margin-bottom: 14px; }
    p { color: var(--muted); margin: 0 0 16px; }
    input { width: 100%; padding: 8px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
    input:focus { outline: none; border-color: var(--accent); }
    button { margin-top: 12px; width: 100%; padding: 8px; }
    #err { color: var(--warn); min-height: 1.4em; margin-top: 10px; }
  </style>
</head>
<body>
  <form id="f">
    <h1>Zork Cartographer</h1>
    <p>West of House. A password is required to enter.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit">Enter</button>
    <div id="err"></div>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const r = await fetch("/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value }),
      });
      if (r.ok) location.href = "/";
      else err.textContent = "That's not it. (Try again.)";
    });
  </script>
</body>
</html>
